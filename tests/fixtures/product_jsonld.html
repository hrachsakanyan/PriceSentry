<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>JSON-LD fixture</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "Test Product",
    "offers": {"@type": "Offer", "price": "89.50", "priceCurrency": "GBP"}
  }
  </script>
</head>
<body><h1>Test Product</h1></body>
</html>
